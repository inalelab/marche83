    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading chart and data...</p>
        </div>
        <div id="error"></div>
        <div id="plotly-chart"></div>
        <div id="docs-output">
            <p style="color: #999; text-align: center;">Click on any bar to see representative documents</p>
        </div>

    <script>
        // Configuration - UPDATE THIS URL TO YOUR ACTUAL GITHUB PAGES URL
        const REPR_MAP_URL = 'https://inalelab.github.io/marche83/figs/fig_data/repr_map.json';
        
        // State management
        let reprMap = {};
        let lastClick = { topic: null, year: null, time: 0 };
        let isRendering = false;

        // Load the repr_map data
        async function loadReprMap() {
            try {
                const response = await fetch(REPR_MAP_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                // Convert string keys back to lookups
                reprMap = data;
                
                console.log(`Loaded repr_map with ${Object.keys(reprMap).length} entries`);
                return true;
            } catch (error) {
                console.error('Error loading repr_map:', error);
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = 
                    `<strong>Failed to load data</strong><br>` +
                    `URL: ${REPR_MAP_URL}<br>` +
                    `Error: ${error.message}<br><br>` +
                    `Please check that the file is accessible and CORS is enabled.`;
                return false;
            }
        }

        // Render documents table
        function renderDocs(docsList, topicId, year) {
            const output = document.getElementById('docs-output');
            
            if (!docsList || docsList.length === 0) {
                output.innerHTML = `
                    <div class="no-docs">
                        <strong>Year ${year} — Topic ${topicId}:</strong> No representative documents found.
                    </div>
                `;
                return;
            }

            const rows = docsList.map(d => {
                const title = d.title || '(Sans titre)';
                const url = d.chunk_url || d.url;
                const channel = d.channel || '';
                const tc = d.chunk_tc || '';
                const pub = d.publication_date || '';
                const doc = (d.Document || '').substring(0, 200); // Truncate long passages
                
                const titleHtml = url 
                    ? `<a href="${url}" target="_blank">${title}</a>`
                    : title;

                return `
                    <tr>
                        <td title="${d.Document || ''}">${doc}${(d.Document || '').length > 200 ? '...' : ''}</td>
                        <td>${titleHtml}</td>
                        <td>${channel}</td>
                        <td>${tc}</td>
                        <td>${pub}</td>
                    </tr>
                `;
            }).join('');

            output.innerHTML = `
                <div class="section-title">Year ${year} — Topic ${topicId}: Representative documents</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Passage</th>
                                <th>Title</th>
                                <th>Channel</th>
                                <th>Start (approx)</th>
                                <th>Publication date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Extract topic ID from trace name
        function extractTopicId(traceName) {
            const match = traceName.match(/-?\d+/);
            return match ? parseInt(match[0]) : null;
        }

        // Handle click on chart
        function handlePlotClick(data) {
            if (isRendering) return;

            const point = data.points[0];
            if (!point) return;

            // Extract topic ID from trace name
            const topicId = extractTopicId(point.data.name || '');
            
            // Get year from x value (for vertical bars)
            const year = point.x;
            
            if (topicId === null || year === null) {
                console.log('Could not extract topic or year from click');
                return;
            }

            // Debounce duplicate clicks
            const now = Date.now();
            if (lastClick.topic === topicId && 
                lastClick.year === year && 
                now - lastClick.time < 200) {
                return;
            }

            lastClick = { topic: topicId, year: year, time: now };
            isRendering = true;

            try {
                // Look up documents in repr_map using the same key format we exported
                const key = `${topicId},${year}`;
                const docsList = reprMap[key];
                
                console.log(`Clicked: Topic ${topicId}, Year ${year}, Found ${docsList ? docsList.length : 0} docs`);
                
                renderDocs(docsList, topicId, year);
            } finally {
                isRendering = false;
            }
        }
